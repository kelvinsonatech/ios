name: Lumen
options:
  bundleIdPrefix: com.lumenlearning
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
    resources:
      - path: Lumen/Resources/Assets.xcassets
      - path: Lumen/Resources/Lumen.storekit
        buildPhase: none
    info:
      path: Lumen/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.lumenlearning.auth
            CFBundleURLSchemes:
              - $(LUMEN_URL_SCHEME)
        NSMicrophoneUsageDescription: Lumen uses the microphone only while you hold the talk button so you can ask the AI tutor questions out loud.
        NSSpeechRecognitionUsageDescription: Lumen transcribes your spoken questions so the AI tutor can answer them. Audio is never stored.
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GoogleAuthEnabled: $(GOOGLE_AUTH_ENABLED)
        StoreKitProductIDs: $(STOREKIT_PRODUCT_IDS)
        AuthCallbackScheme: $(LUMEN_URL_SCHEME)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Lumen/Resources/Lumen.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - LumenTests
      storeKitConfiguration: Lumen/Resources/Lumen.storekit

  LumenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumenTests
    dependencies:
      - target: Lumen
