# Local development dependencies only (run the app with `npm run dev`).
#   docker compose -f docker-compose.dev.yml up -d
name: vaultline-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vaultline, POSTGRES_PASSWORD: vaultline, POSTGRES_DB: vaultline }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  postgres-test:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vaultline, POSTGRES_PASSWORD: vaultline, POSTGRES_DB: vaultline_test }
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
