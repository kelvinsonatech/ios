# Production-style stack. Copy .env.example to .env and fill in secrets first.
#   docker compose up -d --build
#   docker compose run --rm migrate node dist/scripts/create-admin.mjs --email you@example.com --role super_admin
name: vaultline

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://vaultline:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/vaultline
    REDIS_URL: redis://redis:6379
    TRUSTED_PROXY_HOPS: "1"
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vaultline
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultline"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "node dist/scripts/migrate.mjs && node dist/scripts/seed.mjs"]
    restart: "no"

  web:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    expose: ["3000"]

  worker:
    <<: *app
    command: ["node", "dist/src/worker/index.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
